name: CI

on:
  pull_request:
  push:
    branches: [main]

# Read-only token. This workflow needs no secrets and must never be given any:
# the whole suite passes on a clean checkout with no .env file present.
permissions:
  contents: read

# A newer push to the same PR/branch cancels the older run still in flight.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 22 LTS. package.json engines says ">=20" and there is no .nvmrc,
      # so CI picks the version explicitly rather than inheriting a default.
      # better-sqlite3 ships prebuilt binaries for LTS ABIs, which keeps
      # `npm ci` from falling back to a slow node-gyp source build.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # `npm ci` (not `npm install`) so the lockfile is authoritative.
      # No --omit=dev: typescript is a devDependency and the typecheck needs it.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # `!cancelled()` so a typecheck failure still lets the tests report.
      # Otherwise you fix tsc, push, and only then discover the test failures.
      - name: Test
        if: ${{ !cancelled() }}
        run: npm test
